name: keep-awake

# Visits the live Streamlit demos every 6 hours so they don't go to sleep.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright==1.49.1 && playwright install --with-deps chromium
      - run: >
          python scripts/keep_awake.py
          https://wnba-agentic-rag.streamlit.app/
          https://nba-matchup-predictor.streamlit.app/
