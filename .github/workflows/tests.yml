name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Stat engine vs. official box scores, season tools, resolver regressions, grader.
      # Uses the committed data/processed tables; no API key needed.
      - run: pytest -q
